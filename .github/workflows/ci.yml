name: SchoolPro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/school-billing-visibility-test.mjs
      - run: node scripts/schoolpro-account-access-test.mjs
      - run: npm run build
