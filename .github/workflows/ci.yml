name: SchoolPro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate class subject-average export independently
        run: node scripts/test-class-results-export.mjs
      - run: npm run typecheck
      - run: node scripts/test-startup-diagnostic.mjs
      - run: node scripts/test-school-context-refresh.mjs
      - run: node scripts/test-school-access-cache.mjs
      - run: node scripts/test-school-dashboard-roles.mjs
      - run: node scripts/test-school-context-relationships.mjs
      - run: node scripts/test-school-lesson-paging.mjs
      - run: node scripts/test-result-section-data.mjs
      - run: node scripts/test-result-workflow.mjs
      - run: node scripts/test-class-results-export.mjs
      - run: node scripts/test-school-student-selection.mjs
      - run: node scripts/test-operational-roles.mjs
      - run: node scripts/test-native-entry-security.mjs
      - run: node scripts/test-browser-vault.mjs
      - run: node scripts/test-app-idle-lock.mjs
      - run: node scripts/school-billing-visibility-test.mjs
      - run: node scripts/schoolpro-account-access-test.mjs
      - run: node scripts/school-document-design-test.mjs
      - run: node scripts/school-email-signin-test.mjs
      - run: node scripts/test-template-preview.mjs
      - name: Check mobile frames, carousel and customer layouts
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test-mobile-layout.mjs
          node scripts/test-operational-documents.mjs
          node scripts/test-full-report-print.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-checks
          path: mobile-ui-evidence/
      - run: npm run build
