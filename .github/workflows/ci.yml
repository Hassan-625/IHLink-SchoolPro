name: SchoolPro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-startup-diagnostic.mjs
      - run: node scripts/test-school-context-refresh.mjs
      - run: node scripts/test-school-access-cache.mjs
      - run: node scripts/test-school-dashboard-roles.mjs
      - run: node scripts/test-school-context-relationships.mjs
      - run: node scripts/test-school-lesson-paging.mjs
      - run: node scripts/test-result-section-data.mjs
      - run: node scripts/test-result-workflow.mjs
      - run: node scripts/test-class-results-export.mjs
      - run: node scripts/test-school-student-selection.mjs
      - run: node scripts/test-operational-roles.mjs
      - run: node scripts/test-native-entry-security.mjs
      - run: node scripts/test-browser-vault.mjs
      - run: node scripts/test-app-idle-lock.mjs
      - run: node scripts/school-billing-visibility-test.mjs
      - run: node scripts/schoolpro-account-access-test.mjs
      - run: node scripts/school-document-design-test.mjs
      - run: node scripts/school-email-signin-test.mjs
      - run: node scripts/test-template-preview.mjs
      - name: Check mobile frames, carousel and customer layouts
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test-mobile-layout.mjs
          node scripts/test-operational-documents.mjs
          node scripts/test-full-report-print.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-checks
          path: mobile-ui-evidence/
      - run: npm run build

  mysql-api-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: schoolpro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for disposable MySQL
        env:
          MYSQL_PWD: root-test-password
        run: |
          for attempt in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'MySQL did not become ready' >&2
          exit 1
      - name: Apply core schema and synthetic tenant fixtures
        env:
          MYSQL_PWD: root-test-password
        run: |
          mysql --show-warnings -h 127.0.0.1 -uroot schoolpro_test < database/mysql/001_schoolpro_core.sql
          mysql --show-warnings -h 127.0.0.1 -uroot schoolpro_test < database/mysql/007_schoolpro_auth_login_throttling.sql
          mysql --show-warnings -h 127.0.0.1 -uroot schoolpro_test < tests/mysql/schoolpro_core_fixture.sql
      - name: Install MySQL API runtime dependency
        working-directory: server/mysql-api
        run: npm install --no-save --package-lock=false mysql2@3.15.3
      - name: Test authentication, origin protection and tenant context
        working-directory: server/mysql-api
        run: npm test
