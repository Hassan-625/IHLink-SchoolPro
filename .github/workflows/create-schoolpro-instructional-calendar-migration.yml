name: Create SchoolPro instructional calendar migration

on:
  push:
    branches:
      - automation/schoolpro-calendar-migration-bootstrap
    paths:
      - .github/workflows/create-schoolpro-instructional-calendar-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schoolpro-instructional-calendar-migration
  cancel-in-progress: false

jobs:
  create-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install stable Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v3.stable

      - name: Create timestamped migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new schoolpro_instructional_calendar
          files=(supabase/migrations/*_schoolpro_instructional_calendar.sql)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one generated instructional-calendar migration file."
            exit 1
          fi
          test -s "${files[0]}" && { echo "Generated file: ${files[0]}"; } || true

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_schoolpro_instructional_calendar.sql
          if git diff --cached --quiet; then
            echo "No migration file was generated."
            exit 1
          fi
          git commit -m "chore(schoolpro): generate instructional calendar migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
