name: Legacy payment migration ACL test

on:
  push:
    branches:
      - main
      - fix/result-design-section-selection
  pull_request:
    branches:
      - main
      - fix/report-card-assessment-term-history
  workflow_dispatch:

jobs:
  migration-acl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Run candidate migration against disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash scripts/test-legacy-payment-migration.sh
