name: SchoolPro API checks

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/schoolpro-api.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/schoolpro-api.yml"

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm test
