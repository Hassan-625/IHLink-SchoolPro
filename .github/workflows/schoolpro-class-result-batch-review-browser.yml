name: SchoolPro class result batch review browser regression
on:
  pull_request:
    paths:
      - "src/components/schoolpro/SchoolProClassResultBatchReview.tsx"
      - "src/pages/schoolpro/SchoolProResultTemplates.tsx"
      - "scripts/test-schoolpro-class-result-batch-review-browser.mjs"
      - ".github/workflows/schoolpro-class-result-batch-review-browser.yml"
  push:
    branches:
      - feat/schoolpro-consolidated-class-result-workbook
    paths:
      - "src/components/schoolpro/SchoolProClassResultBatchReview.tsx"
      - "src/pages/schoolpro/SchoolProResultTemplates.tsx"
      - "scripts/test-schoolpro-class-result-batch-review-browser.mjs"
      - ".github/workflows/schoolpro-class-result-batch-review-browser.yml"
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-schoolpro-class-result-batch-review-browser.mjs
      - run: npm run typecheck
      - run: npm run build
