name: SchoolPro class-result batch roster

on:
  pull_request:
    paths:
      - "src/lib/schoolproClassResultBatchRoster.mjs"
      - "scripts/test-schoolpro-class-result-batch-roster.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/schoolpro-class-result-batch-roster.yml"
  push:
    branches:
      - feat/schoolpro-class-result-batch-roster-contract
    paths:
      - "src/lib/schoolproClassResultBatchRoster.mjs"
      - "scripts/test-schoolpro-class-result-batch-roster.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/schoolpro-class-result-batch-roster.yml"

permissions:
  contents: read

jobs:
  roster-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:schoolpro-class-result-batch-roster
