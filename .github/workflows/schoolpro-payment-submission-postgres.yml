name: SchoolPro receipt submission PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and exercise receipt submission
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p /workspace/tests /workspace/supabase/migrations
          cp tests/schoolpro-payment-submission-fixture.sql /workspace/tests/
          cp supabase/migrations/20261015143000_harden_schoolpro_payment_receipt_submission.sql /workspace/supabase/migrations/
          psql -h localhost -U postgres -d schoolpro_test -f tests/test-schoolpro-payment-submission.sql
