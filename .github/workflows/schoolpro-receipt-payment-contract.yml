name: SchoolPro receipt payment contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  receipt-payment-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-schoolpro-receipt-payment-contract.mjs
