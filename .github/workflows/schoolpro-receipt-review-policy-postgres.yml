name: SchoolPro receipt review policy PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolpro_test"
          --health-interval 5s
          --health-timeout 5s
          --retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise receipt Storage policy in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d schoolpro_test -f tests/test-schoolpro-receipt-review-policy.sql
